name: Fehler melden
description: Reproduzierbarer Installerfehler, ohne Spielarchive oder Zugangsdaten
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Bitte keine Mod-/Spielarchive, API-Schlüssel oder unbereinigten persönlichen Daten hochladen. Diagnose vorab selbst prüfen."
  - type: input
    id: version
    attributes:
      label: Installer-Version und Windows-Version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte und betroffene Fortschrittsstufe
      description: Welche Aktion, welche konkrete Moddatei/Version, was wurde erwartet?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Fehlermeldung und bereinigte Diagnose
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Vor dem Absenden
      options:
        - label: Ich habe die Anhänge auf Schlüssel, private Pfade und Spiel-/Modinhalte geprüft.
          required: true
